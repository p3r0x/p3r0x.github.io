<h1 id="typed"></h1>

<script>
(function () {
  if (typeof Typed === "undefined") return;

  const messages = [
    "到底啦！别再往下滑了！",
    "没有彩蛋，也没有隐藏内容…",
    "就这么点东西，你就滑到这里了"
  ];

  const easterMessage = "你发现了我的彩蛋，这就带你去na";

  const jumpUrls = [
    "https://ys.mihoyo.com/",
    "https://www.bilibili.com/video/BV1GJ411x7h7/?spm_id_from=333.337.search-card.all.click",
    "https://www.bilibili.com/video/BV1xx411c79H/?spm_id_from=333.337.search-card.all.click",
  ];

  let animationRunning = false;
  let typed1, typed2;
  let jumpTimeout;

  function isScrolledToBottom() {
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const windowHeight = window.innerHeight;
    const docHeight = document.documentElement.scrollHeight;
    return scrollTop + windowHeight >= docHeight - 10;
  }

  function handleScroll() {
    const typedElement = document.getElementById("typed");
    if (!typedElement) return;

    if (window.location.pathname === "/" || window.location.pathname === "/index.html") return;

    if (animationRunning) {
      if (!isScrolledToBottom()) {
        if (typed1) typed1.destroy();
        if (typed2) typed2.destroy();
        if (jumpTimeout) clearTimeout(jumpTimeout);
        typedElement.innerHTML = "";
        animationRunning = false;
      }
      return;
    }

    if (!animationRunning && isScrolledToBottom()) {
      animationRunning = true;

      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      const randomUrl = jumpUrls[Math.floor(Math.random() * jumpUrls.length)];
      typedElement.innerHTML = "";

      typed1 = new Typed("#typed", {
        strings: [randomMsg],
        typeSpeed: 120,
        backSpeed: 0,
        loop: false,
        showCursor: false,
        onStringTyped: function () {
          typed1.destroy();

          typed2 = new Typed("#typed", {
            strings: [easterMessage],
            typeSpeed: 50,
            backSpeed: 0,
            loop: false,
            showCursor: false,
            onStringTyped: function () {
              jumpTimeout = setTimeout(function () {
                if (isScrolledToBottom()) {
                  window.location.href = randomUrl;
                } else {
                  typedElement.innerHTML = "";
                  animationRunning = false;
                }
              }, 900);
            }
          });
        }
      });
    }
  }

  window.addEventListener("scroll", handleScroll);
})();
</script>

<script>
(function () {
    function updateProgressBar() {
        const progressBar = document.getElementById('progress-bar');
        if (!progressBar) return;

        const winScroll = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;

        if (height > 0) {
            const scrolled = (winScroll / height) * 100;
            progressBar.style.width = Math.min(scrolled, 100) + '%';
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updateProgressBar);
    } else {
        updateProgressBar();
    }

    let ticking = false;
    window.addEventListener('scroll', function () {
        if (!ticking) {
            window.requestAnimationFrame(function () {
                updateProgressBar();
                ticking = false;
            });
            ticking = true;
        }
    });
})();
</script>
<script>
(function () {
    function initCodeMoreBox() {
        document.querySelectorAll('.highlight').forEach(function (block) {
            if (block.dataset.codemoreInit) return;
            block.dataset.codemoreInit = '1';

            if (block.scrollHeight <= block.clientHeight) return;

            const box = document.createElement('div');
            box.className = 'code-more-box';

            const btn = document.createElement('span');
            btn.className = 'code-more-btn';

            btn.onclick = function () {
                block.classList.toggle('code-show');
            };

            const img = document.createElement('img');
            img.className = 'code-more-img';
            img.src = '/icons/codeMore.png';

            btn.appendChild(img);
            box.appendChild(btn);
            block.appendChild(box);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initCodeMoreBox);
    } else {
        initCodeMoreBox();
    }
})();
</script>
<script>
(function () {

  function ensureTip(blockEl, text) {
    if (!text) return;
    if (blockEl.dataset.tipInit) return;
    blockEl.dataset.tipInit = "1";

    const style = window.getComputedStyle(blockEl);
    if (style.position === "static") {
      blockEl.style.position = "relative";
    }

    const tip = document.createElement("div");
    tip.className = "code-hover-tip";
    tip.textContent = text;

    blockEl.appendChild(tip);
  }

  function init() {
    document.querySelectorAll(".code-fun").forEach(wrapper => {
      const text = wrapper.dataset.tip;

      wrapper.querySelectorAll(".highlight").forEach(block => {
        ensureTip(block, text);
      });

      wrapper.querySelectorAll("pre").forEach(pre => {
        if (pre.closest(".highlight")) return;
        ensureTip(pre, text);
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
